<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Platzwerk Statistik</title>
<style>
@property --erx{syntax:'<angle>';inherits:false;initial-value:0deg}
@property --ery{syntax:'<angle>';inherits:false;initial-value:0deg}
*{box-sizing:border-box;margin:0;padding:0;animation-play-state:paused!important}
html,body{background:#000;overflow:hidden;width:100%;height:100%}
:root{--blue:#4f9dff;--blue2:#8fc4ff;--yel:#ffc74a;--yel2:#ffe29a;--dim:rgba(214,226,255,.62);--dim2:rgba(214,226,255,.4)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(120% 90% at 70% 0%,#0a1330 0%,#050814 55%,#03050b 100%);
  color:#f4f7ff;font-family:'Inter',sans-serif;font-feature-settings:'tnum','ss01','cv11';--rx:0deg;--ry:0deg;--fy:0px;transform-origin:0 0}
.port #stage{width:1080px;height:1920px}

/* ---------- Hintergrund ---------- */
.orb{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none}
#o1{width:1500px;height:1500px;background:radial-gradient(circle,rgba(42,104,255,.50),rgba(42,104,255,.14) 40%,rgba(42,104,255,0) 68%)}
#o2{width:1200px;height:1200px;background:radial-gradient(circle,rgba(74,60,220,.34),rgba(60,60,210,.1) 42%,rgba(60,60,210,0) 68%)}
#o3{width:820px;height:820px;background:radial-gradient(circle,rgba(255,190,70,.26),rgba(255,180,60,.07) 45%,rgba(255,180,60,0) 68%)}
#o4{width:380px;height:380px;background:radial-gradient(circle at 35% 30%,rgba(170,210,255,.95),rgba(79,157,255,.75) 35%,rgba(40,90,230,.25) 62%,rgba(40,90,230,0) 72%)}
#o5{width:250px;height:250px;background:radial-gradient(circle at 35% 30%,rgba(255,236,180,.95),rgba(255,199,74,.7) 38%,rgba(255,150,40,.18) 62%,rgba(255,150,40,0) 72%)}
#o6{width:170px;height:170px;background:radial-gradient(circle at 35% 30%,rgba(200,225,255,.9),rgba(110,170,255,.6) 40%,rgba(60,110,240,0) 72%)}
#ring1{width:620px;height:620px;border:2px solid rgba(160,195,255,.16)}
#ring2{width:340px;height:340px;border:1.5px solid rgba(255,210,120,.2)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(0,0,6,.62) 100%);pointer-events:none}
#fade{position:absolute;inset:0;background:#000;pointer-events:none;z-index:50}

/* ---------- Glas ---------- */
.gl{position:relative;border-radius:36px;
  background:linear-gradient(140deg,rgba(255,255,255,.125),rgba(255,255,255,.04) 46%,rgba(110,150,255,.06));
  backdrop-filter:blur(34px) saturate(175%);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(255,255,255,.05),inset 0 0 70px rgba(110,150,255,.07),0 44px 90px -24px rgba(0,0,6,.7),0 10px 26px rgba(0,0,6,.28)}
.gl::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(112deg,rgba(255,255,255,.17) 0%,rgba(255,255,255,0) 30%,rgba(255,255,255,0) 70%,rgba(255,255,255,.06) 100%);
  background-size:220% 100%;background-position:var(--shx,30%) 0}
.gl.y{background:linear-gradient(140deg,rgba(255,206,100,.2),rgba(255,199,74,.05) 50%,rgba(255,255,255,.04));border-color:rgba(255,214,130,.3);
  box-shadow:inset 0 1px 0 rgba(255,236,190,.4),inset 0 0 70px rgba(255,190,70,.1),0 44px 90px -24px rgba(0,0,6,.7),0 0 70px -10px rgba(255,190,70,.22)}
.t{transform:perspective(1700px) translateY(calc(var(--fy)*var(--fk,1))) rotateX(calc(var(--rx)*var(--k,1) + var(--erx))) rotateY(calc(var(--ry)*var(--k,1) + var(--ery)))}
.tile{border-radius:24px;background:linear-gradient(150deg,rgba(255,255,255,.1),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}

/* ---------- Animation ---------- */
.a{animation:in 1.25s cubic-bezier(.16,1,.3,1) both,out .7s cubic-bezier(.6,0,.85,.25) forwards;
  animation-delay:calc((var(--s) + var(--d,0))*1s),calc((var(--e) - .78 + var(--x,0))*1s)}
@keyframes in{from{opacity:0;translate:0 48px;scale:.96;filter:blur(18px);--erx:16deg}to{opacity:1;translate:0 0;scale:1;filter:none;--erx:0deg}}
@keyframes out{to{opacity:0;translate:0 -36px;scale:1.025;filter:blur(14px);--erx:-9deg}}
.a.l{animation-name:inl,out}
@keyframes inl{from{opacity:0;translate:-70px 0;filter:blur(16px);--ery:-18deg}to{opacity:1;translate:0 0;filter:none;--ery:0deg}}
.a.z{animation-name:inz,out;animation-duration:1.7s,.7s}
@keyframes inz{from{opacity:0;scale:.82;filter:blur(26px)}to{opacity:1;scale:1;filter:none}}
.gw{animation:gw 1.5s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc((var(--s) + var(--d,0))*1s)}
@keyframes gw{from{width:0}}
.gh{animation:gh 1.5s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc((var(--s) + var(--d,0))*1s)}
@keyframes gh{from{height:0}}
.seg{animation:seg 1.3s cubic-bezier(.3,.8,.3,1) both;animation-delay:calc((var(--s) + var(--d,0))*1s)}
@keyframes seg{from{stroke-dasharray:0 1000}}
.draw{stroke-dasharray:1 1;animation:draw 2.6s cubic-bezier(.4,.1,.3,1) both;animation-delay:calc((var(--s) + var(--d,0))*1s)}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.fi{animation:fi 1.2s ease both;animation-delay:calc((var(--s) + var(--d,0))*1s)}
@keyframes fi{from{opacity:0}}
.pop{animation:pop .9s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc((var(--s) + var(--d,0))*1s)}
@keyframes pop{from{opacity:0;scale:.3}}

/* ---------- Szenen-Grundgerüst ---------- */
.scene{position:absolute;inset:0;padding:78px 110px 118px;display:none;flex-direction:column}
.scene.on{display:flex}
.eb{font-size:22px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--blue2);display:flex;align-items:center;gap:16px}
.eb::before{content:'';width:34px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--yel),rgba(255,199,74,.2))}
h2{font-family:'Inter Display','Inter',sans-serif;font-size:70px;font-weight:700;letter-spacing:-.025em;line-height:1.08;margin-top:14px}
.body{flex:1;display:flex;margin-top:38px;min-height:0}
.num{font-family:'Inter Display','Inter',sans-serif;font-weight:700;letter-spacing:-.03em}
.yt{background:linear-gradient(180deg,#ffe7a8,#ffc74a 55%,#f5a52a);-webkit-background-clip:text;background-clip:text;color:transparent}
.wt{background:linear-gradient(180deg,#fff 20%,#b9d2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.bt{background:linear-gradient(180deg,#b9d8ff,#4f9dff);-webkit-background-clip:text;background-clip:text;color:transparent}
#foot{position:absolute;left:110px;right:110px;bottom:38px;display:flex;justify-content:space-between;align-items:center;font-size:18px;color:var(--dim2);letter-spacing:.02em;z-index:5}
#foot img{height:46px;opacity:.9}
#prog{position:absolute;left:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--blue),var(--blue2) 60%,var(--yel));box-shadow:0 0 18px rgba(79,157,255,.8);z-index:6}

/* ---------- S1 Titel ---------- */
#s1{align-items:center;justify-content:center;text-align:center;padding-bottom:78px}
#s1 .logo{width:470px;margin-bottom:54px}
#s1 .eb{font-size:26px;letter-spacing:.5em;color:#fff;gap:26px;padding-left:.5em}
#s1 .eb::before,#s1 .eb::after{content:'';width:90px;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,199,74,0),var(--yel))}
#s1 .eb::after{background:linear-gradient(270deg,rgba(255,199,74,0),var(--yel))}
#s1 h1{font-family:'Inter Display','Inter',sans-serif;font-size:168px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:34px 0 50px}
#s1 h1 span{display:inline-block}
#s1 .pill{padding:20px 44px;border-radius:60px;font-size:30px;color:#e6eeff}
#s1 .pill b{color:var(--yel);font-weight:600}

/* ---------- S2 Gesamt ---------- */
#s2 .body{flex-direction:column;justify-content:center;align-items:center;margin-top:0}
.hero{display:flex;align-items:baseline;gap:34px}
.hero .big{font-size:330px;line-height:.95;font-weight:800}
.hero .unit{font-size:96px;font-weight:700;font-family:'Inter Display';letter-spacing:-.02em}
.row{display:flex;gap:30px}
.kpi{padding:30px 44px 34px;min-width:440px}
.kpi small{display:block;font-size:24px;color:var(--dim)}
.kpi b{display:block;font-size:78px;margin-top:6px}
.kpi .tr{height:8px;border-radius:8px;background:rgba(255,255,255,.1);margin-top:18px;overflow:hidden}
.kpi .tr i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#2f6ee8,var(--blue2));box-shadow:0 0 16px rgba(79,157,255,.8)}
.kpi.y .tr i{background:linear-gradient(90deg,#f5a52a,var(--yel2));box-shadow:0 0 16px rgba(255,199,74,.8)}

/* ---------- Säulen-Chart ---------- */
.chart{flex:1;padding:96px 56px 92px 104px;display:flex}
.plot{position:relative;flex:1;display:flex;align-items:flex-end;gap:14px}
.gridl{position:absolute;left:-12px;right:0;height:1px;background:rgba(255,255,255,.09)}
.gridl span{position:absolute;right:calc(100% + 14px);top:-13px;font-size:20px;color:var(--dim2)}
.gridl.base{background:rgba(255,255,255,.3)}
.col{position:relative;flex:1;height:100%;display:flex;align-items:flex-end}
.col i{display:block;width:100%;border-radius:12px 12px 4px 4px;background:linear-gradient(180deg,#a8d0ff 0%,#4f9dff 30%,rgba(47,110,232,.55) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 1px 0 0 rgba(255,255,255,.18),0 0 26px rgba(79,157,255,.4)}
.col.pk i{background:linear-gradient(180deg,#fff0c4 0%,#ffc74a 28%,rgba(245,165,42,.6) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 0 44px rgba(255,199,74,.65)}
.col span{position:absolute;top:calc(100% + 14px);left:50%;translate:-50% 0;font-size:19px;color:var(--dim)}
.col em{position:absolute;top:calc(100% + 44px);left:50%;translate:-50% 0;font-size:20px;font-weight:700;font-style:normal;color:#fff}
.call{position:absolute;bottom:calc(100% + 16px);left:50%;translate:-50% 0;white-space:nowrap;padding:10px 22px;border-radius:40px;font-size:26px;font-weight:700;color:#1a1204;
  background:linear-gradient(180deg,#ffe7a8,#ffc74a);box-shadow:0 0 40px rgba(255,199,74,.55),inset 0 1px 0 #fff}

/* ---------- S4 Fraktionen ---------- */
#s4 .body{gap:44px;align-items:center}
.donut{width:600px;height:600px;flex:none;border-radius:50%;display:grid;place-items:center}
.donut svg{position:absolute;inset:38px;width:calc(100% - 76px);height:calc(100% - 76px);rotate:-90deg;overflow:visible}
.donut circle{fill:none;stroke-width:17;stroke-linecap:butt}
.donut .mid{text-align:center}
.donut .mid b{display:block;font-size:104px;line-height:1}
.donut .mid small{font-size:26px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.list{flex:1;display:flex;flex-direction:column;gap:13px}
.li{display:flex;align-items:center;padding:0 32px;height:70px;border-radius:22px;font-size:27px}
.li .dot{width:16px;height:16px;border-radius:50%;margin-right:22px;box-shadow:0 0 16px currentColor;background:currentColor;flex:none}
.li .nm{width:400px;color:#eef3ff}
.li .tr{flex:1;height:10px;border-radius:10px;background:rgba(255,255,255,.08);margin:0 28px}
.li .tr i{display:block;height:100%;border-radius:10px;background:currentColor;box-shadow:0 0 14px currentColor}
.li b{width:150px;text-align:right;font-size:32px;color:#fff}
.li .pc{width:96px;text-align:right;color:var(--dim)}

/* ---------- S5 Entsorger ---------- */
#s5 .body{display:grid;grid-template-columns:520px 1fr;grid-template-rows:1fr auto;gap:24px}
.heroc{grid-row:1;padding:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring{position:relative;width:300px;height:300px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;rotate:-90deg;overflow:visible}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring b{font-size:84px}
.heroc h3{font-size:44px;font-weight:700;margin-top:22px;font-family:'Inter Display'}
.heroc p{font-size:60px;margin-top:2px}
.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:24px}
.et{grid-column:span 2;padding:26px 30px;display:flex;flex-direction:column;justify-content:space-between;border-radius:30px}
.et.w{grid-column:span 3}
.et .top{display:flex;justify-content:space-between;font-size:27px;color:#eaf0ff}
.et .top span{color:var(--dim)}
.et b{font-size:66px;line-height:1.05}
.et .tr{height:8px;border-radius:8px;background:rgba(255,255,255,.1)}
.et .tr i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#2f6ee8,var(--blue2));box-shadow:0 0 14px rgba(79,157,255,.8)}
.note{grid-column:1/-1;display:flex;align-items:center;gap:30px;padding:20px 40px;font-size:29px;color:#e6eeff;border-radius:30px}
.note b{font-size:76px;line-height:1}

/* ---------- S6 ohne Beleg ---------- */
#s6 .body{flex-direction:column;gap:26px}
.bars{flex:1;padding:22px 48px;display:flex;flex-direction:column;justify-content:space-around}
.br{display:flex;align-items:center;font-size:28px}
.br .nm{width:640px;color:#eef3ff}
.br .tr{flex:1;height:38px;position:relative}
.br .tr i{display:block;height:100%;border-radius:19px;background:linear-gradient(90deg,rgba(47,110,232,.5),#4f9dff 70%,#a8d0ff);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 26px rgba(79,157,255,.45)}
.br:nth-child(2) .tr i{background:linear-gradient(90deg,rgba(245,165,42,.5),#ffc74a 70%,#fff0c4);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 26px rgba(255,199,74,.45)}
.br b{width:170px;text-align:right;font-size:36px}
.br .pc{width:110px;text-align:right;color:var(--dim)}
.eq{display:flex;align-items:center;gap:26px;height:170px}
.eq .gl{height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 44px;border-radius:32px}
.eq small{font-size:22px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.eq b{font-size:64px;line-height:1.1}
.eq .op{font-size:70px;font-weight:300;color:var(--dim)}
.eq .sum{flex:1;align-items:center}
.eq .sum b{font-size:112px}

/* ---------- S7 Container ---------- */
#s7 .body{flex-direction:column;gap:26px}
.c74{display:flex;align-items:center;gap:60px;flex:1}
.c74 .n{font-size:330px;line-height:.9;font-weight:800}
.c74 h3{font-family:'Inter Display';font-size:74px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.c74 .l{flex:none}
.c74 .r{flex:1}
.c74 .cap{font-size:26px;color:var(--dim);margin-bottom:16px;letter-spacing:.14em;text-transform:uppercase}
.c74 .cap b{color:#fff}
.c74 .row .gl{flex:1;padding:22px 30px;border-radius:28px}
.c74 .row b{font-size:92px;line-height:1;display:block}
.c74 .row .gl>span{font-size:26px;color:var(--dim)}
.split{padding:28px 44px 30px}
.split .cap{font-size:24px;color:var(--blue2);font-weight:600}
.stripe{display:flex;gap:8px;height:74px;margin:16px 0 18px}
.stripe div{overflow:hidden;border-radius:18px;display:flex}
.stripe i{display:flex;align-items:center;flex:none;width:100%;border-radius:18px;font-style:normal;font-size:38px;font-weight:800;padding-left:26px;color:#071022;font-family:'Inter Display';box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.lg{display:flex;gap:54px;font-size:27px}
.lg span{display:flex;align-items:center;gap:14px}
.lg span::before{content:'';width:18px;height:18px;border-radius:6px;background:currentColor;box-shadow:0 0 12px currentColor}
.lg em{font-style:normal;color:#eef3ff}
.split p{font-size:21px;color:var(--dim2);margin-top:14px}

/* ---------- S8 Liter ---------- */
#s8 .body{gap:26px}
.area{flex:1;position:relative;padding:0}
.area svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.area text{font-family:'Inter';fill:rgba(214,226,255,.62);font-size:19px}
.side{width:400px;display:flex;flex-direction:column;gap:20px}
.tot{padding:28px 34px;flex:1.5;display:flex;flex-direction:column;justify-content:center}
.tot small{font-size:22px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.tot b{font-size:108px;line-height:1.05}
.tot>span{font-size:44px;font-weight:700;font-family:'Inter Display';color:var(--yel)}
.fu{flex:1;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-radius:28px;font-size:29px;color:var(--dim)}
.fu b{font-size:50px;color:#fff}

/* ---------- S9 Tankkarten ---------- */
#s9 .body{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:24px}
.tk{padding:28px 30px;display:flex;flex-direction:column;justify-content:space-between;border-radius:32px}
.tk .top{display:flex;justify-content:space-between;align-items:flex-start;font-size:25px;color:#eaf0ff;line-height:1.25}
.tk .top span{color:var(--dim);flex:none;margin-left:10px;font-size:25px}
.tk .rk{font-size:19px;color:var(--dim2);letter-spacing:.16em;margin-bottom:8px}
.tk b{font-size:92px;line-height:1}
.tk b small{font-size:44px;font-weight:600;color:var(--dim);margin-left:8px;letter-spacing:0;-webkit-text-fill-color:initial}
.tk .tr{height:9px;border-radius:9px;background:rgba(255,255,255,.1)}
.tk .tr i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#2f6ee8,var(--blue2));box-shadow:0 0 14px rgba(79,157,255,.8)}
.tk.y .tr i{background:linear-gradient(90deg,#f5a52a,var(--yel2));box-shadow:0 0 14px rgba(255,199,74,.8)}

/* ---------- S10 Tankstellen ---------- */
#s10 .body{gap:30px}
.tubes{flex:1.25;display:flex;justify-content:space-around;align-items:stretch;padding:34px 30px 30px}
.tb{display:flex;flex-direction:column;align-items:center;width:250px}
.tb b{font-size:60px;line-height:1}
.tb .pc{font-size:24px;color:var(--dim);margin:4px 0 16px}
.tb .glass{flex:1;width:150px;border-radius:75px;position:relative;overflow:hidden;background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,.03) 40%,rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 0 30px rgba(0,0,10,.5)}
.tb .glass i{position:absolute;left:0;right:0;bottom:0;border-radius:0 0 75px 75px;background:linear-gradient(180deg,#a8d0ff,#4f9dff 18%,#2456c8);box-shadow:0 0 40px rgba(79,157,255,.7)}
.tb .glass i::before{content:'';position:absolute;left:0;right:0;top:0;height:10px;background:rgba(255,255,255,.75);border-radius:50%;translate:0 -4px;filter:blur(2px)}
.tb .glass::after{content:'';position:absolute;left:16px;top:26px;bottom:26px;width:14px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.05))}
.tb.y .glass i{background:linear-gradient(180deg,#fff0c4,#ffc74a 18%,#e08a14);box-shadow:0 0 40px rgba(255,199,74,.7)}
.tb .nm{font-size:27px;margin-top:16px;text-align:center;color:#eef3ff}
.chips{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.chp{padding:26px 32px;border-radius:32px;display:flex;flex-direction:column;justify-content:space-between}
.chp .top{display:flex;justify-content:space-between;font-size:27px;color:#eaf0ff}
.chp .top span{color:var(--dim)}
.chp b{font-size:84px;line-height:1}
.chp b small{font-size:40px;font-weight:600;color:var(--dim);margin-left:8px;-webkit-text-fill-color:initial}

/* ---------- S11 Fuhrpark ---------- */
#s11 .body{flex-direction:column;justify-content:center}
.tl{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:18px}
.tl .line{position:absolute;left:0;right:0;top:66px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--yel));box-shadow:0 0 18px rgba(255,199,74,.6)}
.ev{display:flex;flex-direction:column;align-items:center}
.ev .dt{font-size:34px;font-weight:700;font-family:'Inter Display';height:44px}
.ev .nd{width:26px;height:26px;border-radius:50%;margin:10px 0 28px;background:radial-gradient(circle at 35% 30%,#fff,#ffc74a 55%);box-shadow:0 0 0 7px rgba(255,199,74,.16),0 0 26px rgba(255,199,74,.9);position:relative;z-index:2}

<body>
<div id="stage">
  <div class="orb" id="o1"></div><div class="orb" id="o2"></div><div class="orb" id="o3"></div>
  <div class="orb" id="ring1"></div><div class="orb" id="ring2"></div>
  <div class="orb" id="o4"></div><div class="orb" id="o5"></div><div class="orb" id="o6"></div>
  <div id="vig"></div>
  <div id="scenes"></div>
  <div id="foot"><span id="ft"></span><img src="logo.png" alt=""></div>
  <div id="prog"></div>
  <div id="fade"></div>
</div>
<script src="data.js"></script>
<script>
const Q=new URLSearchParams(location.search);
const PORT=Q.get('fmt')==='port';
if(PORT)document.body.classList.add('port');
const W=PORT?1080:1920,H=PORT?1920:1080;
const BAR=2.4, LEN=[4,5,5,6,5,6,6,5,5,5,6,6];
const ST=[];let acc=0;for(const l of LEN){ST.push(acc*BAR);acc+=l}
const TOTAL=acc*BAR; // 153.6 s
const de=(v,d=0)=>v.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const cnt=(to,dec,at,dur=2.2)=>`<span class="cnt" data-to="${to}" data-dec="${dec}" data-at="${at}" data-dur="${dur}">${de(to,dec)}</span>`;
const hd=(eb,h)=>`<header><div class="eb a" style="--d:.15">${eb}</div><h2 class="a" style="--d:.3">${h}</h2></header>`;
const PAL=['#4f9dff','#ffc74a','#8fc4ff','#2f6ee8','#ffe29a','#c9d6f2','#7786a8'];
const MON=D.mon;

/* ---------- Bausteine (alle Zahlen kommen aus data.js) ---------- */
function ticks(max){return [1,2,3,4].map(k=>[max*k/4,de(Math.round(max*k/4))])}
function columns(data,pk,call){
  const max=data[pk];
  let h=ticks(max).map(([v,l])=>`<div class="gridl fi" style="--d:.6;bottom:${v/max*100}%"><span>${l}</span></div>`).join('')+'<div class="gridl base" style="bottom:0"></div>';
  const yr=Object.fromEntries(D.jahr_idx);
  h+=data.map((v,i)=>`<div class="col${i===pk?' pk':''}"><i class="gh" style="height:${v/max*100}%;--d:${(.9+i*.085).toFixed(2)}"></i><span>${MON[i]}</span>${yr[i]?`<em>${yr[i]}</em>`:''}${i===pk?`<div class="call pop" style="--d:${(2.2+i*.085).toFixed(2)};bottom:calc(${v/max*100}% + 16px)">${call}</div>`:''}</div>`).join('');
  return `<div class="plot">${h}</div>`;
}
function donut(){
  let off=0,s='';
  D.frak.forEach((f,i)=>{const l=f.t/D.total*1000;s+=`<circle class="seg" cx="50%" cy="50%" r="47%" pathLength="1000" stroke="${PAL[i%7]}" style="--d:${(.7+i*.22).toFixed(2)};stroke-dasharray:${Math.max(l-5,2).toFixed(1)} 1000;stroke-dashoffset:${(-off).toFixed(1)};filter:drop-shadow(0 0 10px ${PAL[i%7]})"/>`;off+=l});
  return `<svg><circle cx="50%" cy="50%" r="47%" stroke="rgba(255,255,255,.07)"/>${s}</svg>`;
}
function areaChart(){
  const LITER=D.liter_m,N=LITER.length,pkI=D.liter_peak,max=LITER[pkI];
  const w=PORT?960:1154,h=PORT?780:738,pl=92,pr=40,pt=PORT?130:120,pb=92;
  const X=i=>pl+(w-pl-pr)*i/(N-1),Y=v=>pt+(h-pt-pb)*(1-v/max);
  const pts=LITER.map((v,i)=>[X(i),Y(v)]);
  const n=pts.length,dx=[],m=[],t=[];
  for(let i=0;i<n-1;i++){dx.push(pts[i+1][0]-pts[i][0]);m.push((pts[i+1][1]-pts[i][1])/dx[i])}
  t[0]=m[0];t[n-1]=m[n-2];
  for(let i=1;i<n-1;i++){t[i]=m[i-1]*m[i]<=0?0:(m[i-1]+m[i])/2}
  for(let i=0;i<n-1;i++){if(m[i]===0){t[i]=t[i+1]=0}else{const a=t[i]/m[i],b=t[i+1]/m[i],s=a*a+b*b;if(s>9){const k=3/Math.sqrt(s);t[i]=k*a*m[i];t[i+1]=k*b*m[i]}}}
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<n-1;i++){const x1=pts[i][0]+dx[i]/3,y1=pts[i][1]+t[i]*dx[i]/3,x2=pts[i+1][0]-dx[i]/3,y2=pts[i+1][1]-t[i+1]*dx[i]/3;d+=`C${x1.toFixed(1)},${y1.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)} ${pts[i+1][0].toFixed(1)},${pts[i+1][1].toFixed(1)}`}
  const base=Y(0),ar=d+`L${X(N-1)},${base}L${X(0)},${base}Z`;
  let g='';
  ticks(max).forEach(([v,l])=>{g+=`<line x1="${pl-10}" x2="${w-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,.09)"/><text x="${pl-22}" y="${Y(v)+7}" text-anchor="end">${l}</text>`});
  g+=`<line x1="${pl-10}" x2="${w-pr}" y1="${base}" y2="${base}" stroke="rgba(255,255,255,.3)"/>`;
  const step=(PORT||N>24)?2:1;
  let lab='';MON.forEach((mn,i)=>{if(i%step)return;lab+=`<text x="${X(i)}" y="${base+34}" text-anchor="middle">${mn}</text>`});
  D.jahr_idx.forEach(([i,y])=>{lab+=`<text x="${X(i)}" y="${base+64}" text-anchor="middle" style="fill:#fff;font-weight:700">${y}</text>`});
  const dots=pts.map((p,i)=>`<circle class="pop" style="--d:${(1.1+i*.11).toFixed(2)};transform-box:fill-box;transform-origin:center" cx="${p[0]}" cy="${p[1]}" r="${i===pkI?11:6}" fill="${i===pkI?'#ffc74a':'#dff0ff'}" ${i===pkI?'filter="url(#gy)"':''}/>`).join('');
  const px=Math.min(Math.max(pts[pkI][0],pl+140),w-pr-140),py=pts[pkI][1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
  <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f9dff" stop-opacity=".55"/><stop offset="1" stop-color="#4f9dff" stop-opacity="0"/></linearGradient>
  <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f9dff"/><stop offset=".6" stop-color="#bfe0ff"/><stop offset="1" stop-color="#8fc4ff"/></linearGradient>
  <filter id="gl" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="gy" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <g class="fi" style="--d:.5">${g}${lab}</g>
  <path class="fi" style="--d:2.2" d="${ar}" fill="url(#ag)"/>
  <path class="draw" style="--d:.9" pathLength="1" d="${d}" fill="none" stroke="url(#lg)" stroke-width="12" filter="url(#gl)" opacity=".8"/>
  <path class="draw" style="--d:.9" pathLength="1" d="${d}" fill="none" stroke="url(#lg)" stroke-width="5" stroke-linecap="round"/>
  ${dots}
  <g class="pop" style="--d:3.2;transform-box:fill-box;transform-origin:center bottom"><rect x="${px-134}" y="${py-76}" width="268" height="50" rx="25" fill="#ffc74a"/><text x="${px}" y="${py-42}" text-anchor="middle" style="fill:#1a1204;font-weight:700;font-size:25px">${D.liter_peak_label}: ${de(Math.round(max))} l</text></g>
  </svg>`;
}

/* ---------- Szenen ---------- */
const S=[];
S[0]=`<img class="logo a z" style="--d:.5" src="logo.png">
<div class="eb a" style="--d:1.3">Statistik</div>
<h1><span class="a" style="--d:1.7">Das</span> <span class="a" style="--d:1.85">haben</span> <span class="a" style="--d:2">wir</span><br><span class="a yt" style="--d:2.5">geschafft.</span></h1>
<div class="gl t a pill" style="--d:3.3;--k:2">Unsere Zahlen von <b>${D.von}</b> bis <b>${D.bis}</b></div>`;

const jmax=Math.max(...D.jahre.map(j=>j.t));
S[1]=hd(`Entsorgt seit ${D.von}`,'Das haben wir gemeinsam bewegt')+`<div class="body">
<div class="hero a z" style="--d:.7"><span class="num big wt">${cnt(D.total,1,.8,3.2)}</span><span class="unit bt">Tonnen</span></div>
<div class="row" style="margin-top:44px">
${D.jahre.map((j,i)=>{const last=i===D.jahre.length-1;return `<div class="gl${last?' y':''} t a kpi" style="--d:${2.6+i*.3};--k:${last?-1.6:1.6};--x:${.06*(i+1)}"><small>${j.l}</small><b class="num ${last?'yt':'wt'}">${cnt(j.t,1,2.8+i*.3,2)} t</b><div class="tr"><i class="gw" style="--d:${3+i*.3};width:${j.t/jmax*100}%"></i></div></div>`}).join('')}
${D.ohne_datum?`<div class="gl t a kpi sm" style="--d:${2.6+D.jahre.length*.3};--k:1;--x:.2"><small>Zuschlag für fehlende Belege</small><b class="num wt">${cnt(D.ohne_datum,1,3.5,1.6)} t</b></div>`:''}
</div></div>`;

S[2]=hd('Tonnen pro Monat','Monat für Monat angepackt')+`<div class="body"><div class="gl t a chart" style="--d:.5;--k:.8">${columns(D.tons,D.tons_peak,`${D.tons_peak_label}: ${de(D.tons[D.tons_peak],1)} t`)}</div></div>`;

S[3]=hd('Was wir entsorgen','Die größten Fraktionen')+`<div class="body">
<div class="gl t a donut" style="--d:.5;--k:1.5">${donut()}<div class="mid"><b class="num wt">${cnt(D.total,1,.8,2.6)} t</b><small>gesamt</small></div></div>
<div class="list">${D.frak.map((f,i)=>`<div class="gl a l li" style="--d:${(.9+i*.2).toFixed(2)};--x:${(i*.03).toFixed(2)};color:${PAL[i%7]}"><span class="dot"></span><span class="nm">${f.n}</span><span class="tr"><i class="gw" style="--d:${(1.2+i*.2).toFixed(2)};width:${f.t/D.frak[0].t*100}%"></i></span><b class="num">${cnt(f.t,1,1+i*.2,1.6)} t</b><span class="pc">${f.p} %</span></div>`).join('')}</div></div>`;

const E0=D.ents[0];

const root=document.getElementById('scenes');
const scenes=S.map((html,i)=>{const s=document.createElement('section');s.className='scene';s.id='s'+(i+1);
  s.style.setProperty('--s',ST[i]);s.style.setProperty('--e',i===S.length-1?9999:ST[i]+LEN[i]*BAR);s.innerHTML=html;root.appendChild(s);return s});
const counters=[...document.querySelectorAll('.cnt')].map(el=>({el,to:+el.dataset.to,dec:+el.dataset.dec,at:+el.dataset.at,dur:+el.dataset.dur,s:ST[+el.closest('.scene').id.slice(1)-1],last:''}));
const $=id=>document.getElementById(id);
$('ft').textContent=`Platzwerk Allgäu · Statistik · Stand ${D.stand}`;
const stage=$('stage'),orbs=['o1','o2','o3','o4','o5','o6','ring1','ring2'].map($);
const sin=Math.sin,cos=Math.cos,clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const eo=x=>1-Math.pow(1-x,4);

function seek(T){
  T=clamp(T,0,TOTAL);
  scenes.forEach((s,i)=>s.classList.toggle('on',T>=ST[i]-.02&&T<ST[i]+LEN[i]*BAR+.02));
  for(const c of counters){const p=clamp((T-c.s-c.at)/c.dur,0,1),v=de(c.to*eo(p),c.dec);if(v!==c.last){c.el.textContent=v;c.last=v}}
  // Kamera: sanftes Kippen und Schweben
  stage.style.setProperty('--rx',(sin(T*.31)*2.1).toFixed(3)+'deg');
  stage.style.setProperty('--ry',(sin(T*.23+1.1)*3.6).toFixed(3)+'deg');
  stage.style.setProperty('--fy',(sin(T*.52)*7).toFixed(2)+'px');
  stage.style.setProperty('--shx',(50+sin(T*.23+1.1)*45).toFixed(1)+'%');
  // Lichter im Hintergrund
  const P=[[.78+.10*sin(T*.07),.12+.12*cos(T*.09)],[.12+.12*cos(T*.06+2),.9+.1*sin(T*.08)],[.30+.18*sin(T*.05+4),.2+.14*cos(T*.07+1)],
    [.74+.14*sin(T*.11+1),.56+.2*cos(T*.13)],[.22+.14*cos(T*.12+3),.42+.22*sin(T*.1+2)],[.5+.3*sin(T*.09+5),.82+.1*cos(T*.14)],
    [.68+.1*cos(T*.08),.44+.14*sin(T*.06+2)],[.2+.1*sin(T*.1),.7+.12*cos(T*.09+4)]];
  orbs.forEach((o,i)=>{const w=o.offsetWidth;o.style.transform=`translate(${(P[i][0]*W-w/2).toFixed(1)}px,${(P[i][1]*H-w/2).toFixed(1)}px)`});
  $('prog').style.width=(T/TOTAL*100).toFixed(3)+'%';
  $('foot').style.opacity=clamp((T-ST[1]-.4)/1.2,0,1)*clamp((ST[11]-.2-T)/.6,0,1);
  $('fade').style.opacity=Math.max(clamp(1-T/1.1,0,1),clamp((T-(TOTAL-2.4))/2.2,0,1));
  for(const a of document.getAnimations())a.currentTime=T*1000;
}
window.seek=seek;window.TOTAL=TOTAL;
document.fonts.ready.then(()=>{seek(+Q.get('t')||0);window.READY=true;
  if(!Q.has('render')&&!Q.has('t')){ // Vorschau im Browser
    const fit=()=>{const k=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`scale(${k})`};fit();addEventListener('resize',fit);
    const t0=performance.now();(function loop(){seek(((performance.now()-t0)/1000)%TOTAL);requestAnimationFrame(loop)})();
  }});
</script>
