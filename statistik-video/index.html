<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Platzwerk Statistik</title>
<style>
/* Lesbarkeit aus der Entfernung (Lager-TV): im Querformat keine Zahl kleiner als 40 px. */
@property --erx{syntax:'<angle>';inherits:false;initial-value:0deg}
@property --ery{syntax:'<angle>';inherits:false;initial-value:0deg}
*{box-sizing:border-box;margin:0;padding:0;animation-play-state:paused!important}
html,body{background:#000;overflow:hidden;width:100%;height:100%}
:root{--blue:#4f9dff;--blue2:#8fc4ff;--yel:#ffc74a;--yel2:#ffe29a;--dim:rgba(222,232,255,.74);--dim2:rgba(222,232,255,.5)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(120% 90% at 70% 0%,#0a1330 0%,#050814 55%,#03050b 100%);
  color:#f4f7ff;font-family:'Inter',sans-serif;font-feature-settings:'tnum','ss01','cv11';--rx:0deg;--ry:0deg;--fy:0px;transform-origin:0 0}
.port #stage{width:1080px;height:1920px}

/* ---------- Hintergrund ---------- */
.orb{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none}
#o1{width:1500px;height:1500px;background:radial-gradient(circle,rgba(42,104,255,.50),rgba(42,104,255,.14) 40%,rgba(42,104,255,0) 68%)}
#o2{width:1200px;height:1200px;background:radial-gradient(circle,rgba(74,60,220,.34),rgba(60,60,210,.1) 42%,rgba(60,60,210,0) 68%)}
#o3{width:820px;height:820px;background:radial-gradient(circle,rgba(255,190,70,.26),rgba(255,180,60,.07) 45%,rgba(255,180,60,0) 68%)}
#o4{width:380px;height:380px;background:radial-gradient(circle at 35% 30%,rgba(170,210,255,.95),rgba(79,157,255,.75) 35%,rgba(40,90,230,.25) 62%,rgba(40,90,230,0) 72%)}
#o5{width:250px;height:250px;background:radial-gradient(circle at 35% 30%,rgba(255,236,180,.95),rgba(255,199,74,.7) 38%,rgba(255,150,40,.18) 62%,rgba(255,150,40,0) 72%)}
#o6{width:170px;height:170px;background:radial-gradient(circle at 35% 30%,rgba(200,225,255,.9),rgba(110,170,255,.6) 40%,rgba(60,110,240,0) 72%)}
#ring1{width:620px;height:620px;border:2px solid rgba(160,195,255,.16)}
#ring2{width:340px;height:340px;border:1.5px solid rgba(255,210,120,.2)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(0,0,6,.62) 100%);pointer-events:none}
#fade{position:absolute;inset:0;background:#000;pointer-events:none;z-index:50}

/* ---------- Glas ---------- */
.gl{position:relative;border-radius:36px;
  background:linear-gradient(140deg,rgba(255,255,255,.125),rgba(255,255,255,.04) 46%,rgba(110,150,255,.06));
  backdrop-filter:blur(34px) saturate(175%);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(255,255,255,.05),inset 0 0 70px rgba(110,150,255,.07),0 44px 90px -24px rgba(0,0,6,.7),0 10px 26px rgba(0,0,6,.28)}
.gl::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(112deg,rgba(255,255,255,.17) 0%,rgba(255,255,255,0) 30%,rgba(255,255,255,0) 70%,rgba(255,255,255,.06) 100%);
  background-size:220% 100%;background-position:var(--shx,30%) 0}
.gl.y{background:linear-gradient(140deg,rgba(255,206,100,.2),rgba(255,199,74,.05) 50%,rgba(255,255,255,.04));border-color:rgba(255,214,130,.3);
  box-shadow:inset 0 1px 0 rgba(255,236,190,.4),inset 0 0 70px rgba(255,190,70,.1),0 44px 90px -24px rgba(0,0,6,.7),0 0 70px -10px rgba(255,190,70,.22)}
.t{transform:perspective(1700px) translateY(calc(var(--fy)*var(--fk,1))) rotateX(calc(var(--rx)*var(--k,1) + var(--erx))) rotateY(calc(var(--ry)*var(--k,1) + var(--ery)))}

/* ---------- Animation ---------- */
.a{animation:in 1.25s cubic-bezier(.16,1,.3,1) both,out .7s cubic-bezier(.6,0,.85,.25) forwards;
  animation-delay:calc((var(--s) + var(--d,0))*1s),calc((var(--e) - .78 + var(--x,0))*1s)}
@keyframes in{from{opacity:0;translate:0 48px;scale:.96;filter:blur(18px);--erx:16deg}to{opacity:1;translate:0 0;scale:1;filter:none;--erx:0deg}}
@keyframes out{to{opacity:0;translate:0 -36px;scale:1.025;filter:blur(14px);--erx:-9deg}}
.a.l{animation-name:inl,out}
@keyframes inl{from{opacity:0;translate:-70px 0;filter:blur(16px);--ery:-18deg}to{opacity:1;translate:0 0;filter:none;--ery:0deg}}
.a.z{animation-name:inz,out;animation-duration:1.7s,.7s}
@keyframes inz{from{opacity:0;scale:.82;filter:blur(26px)}to{opacity:1;scale:1;filter:none}}
.gw{animation:gw 1.5s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc((var(--s) + var(--d,0))*1s)}
@keyframes gw{from{width:0}}
.gh{animation:gh 1.5s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc((var(--s) + var(--d,0))*1s)}
@keyframes gh{from{height:0}}
.seg{animation:seg 1.3s cubic-bezier(.3,.8,.3,1) both;animation-delay:calc((var(--s) + var(--d,0))*1s)}
@keyframes seg{from{stroke-dasharray:0 1000}}
.fi{animation:fi 1.2s ease both;animation-delay:calc((var(--s) + var(--d,0))*1s)}
@keyframes fi{from{opacity:0}}
.pop{animation:pop .9s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc((var(--s) + var(--d,0))*1s)}
@keyframes pop{from{opacity:0;scale:.3}}

/* ---------- Grundgerüst ---------- */
.scene{position:absolute;inset:0;padding:54px 90px 104px;display:none;flex-direction:column}
.scene.on{display:flex}
.eb{font-size:36px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--blue2);display:flex;align-items:center;gap:18px}
.eb::before{content:'';width:40px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--yel),rgba(255,199,74,.2))}
h2{font-family:'Inter Display','Inter',sans-serif;font-size:78px;font-weight:700;letter-spacing:-.025em;line-height:1.08;margin-top:10px}
.hd{display:flex;justify-content:space-between;align-items:flex-end}
.hd .rt{text-align:right;white-space:nowrap}
.hd .rt small{display:block;font-size:38px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.hd .rt b{font-size:96px;line-height:1}
.body{flex:1;display:flex;margin-top:30px;min-height:0}
.num{font-family:'Inter Display','Inter',sans-serif;font-weight:700;letter-spacing:-.03em}
.yt{background:linear-gradient(180deg,#ffe7a8,#ffc74a 55%,#f5a52a);-webkit-background-clip:text;background-clip:text;color:transparent}
.wt{background:linear-gradient(180deg,#fff 20%,#b9d2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.bt{background:linear-gradient(180deg,#b9d8ff,#4f9dff);-webkit-background-clip:text;background-clip:text;color:transparent}
#foot{position:absolute;left:90px;right:90px;bottom:26px;display:flex;justify-content:space-between;align-items:center;font-size:24px;color:var(--dim2);letter-spacing:.02em;z-index:5}
#foot img{height:50px;opacity:.92}
#prog{position:absolute;left:0;bottom:0;height:6px;background:linear-gradient(90deg,var(--blue),var(--blue2) 60%,var(--yel));box-shadow:0 0 18px rgba(79,157,255,.8);z-index:6}
.tr{height:10px;border-radius:10px;background:rgba(255,255,255,.1)}
.tr i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#2f6ee8,var(--blue2));box-shadow:0 0 16px rgba(79,157,255,.8)}
.y .tr i{background:linear-gradient(90deg,#f5a52a,var(--yel2));box-shadow:0 0 16px rgba(255,199,74,.8)}
.row{display:flex;gap:28px}

/* ---------- Titel ---------- */
.s-title{align-items:center;justify-content:center;text-align:center;padding-bottom:70px}
.s-title .logo{width:560px;margin-bottom:50px}
.s-title .eb{font-size:32px;letter-spacing:.5em;color:#fff;gap:26px;padding-left:.5em}
.s-title .eb::before,.s-title .eb::after{content:'';width:100px;height:3px;border-radius:2px;background:linear-gradient(90deg,rgba(255,199,74,0),var(--yel))}
.s-title .eb::after{background:linear-gradient(270deg,rgba(255,199,74,0),var(--yel))}
.s-title h1{font-family:'Inter Display','Inter',sans-serif;font-size:176px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:30px 0 46px}
.s-title h1 span{display:inline-block}
.pill{padding:22px 50px;border-radius:60px;font-size:40px;color:#e6eeff}
.pill b{color:var(--yel);font-weight:600}

/* ---------- Große Zahl ---------- */
.s-hero .body{flex-direction:column;justify-content:center;align-items:center;margin-top:0}
.hero{display:flex;align-items:baseline;gap:34px}
.hero .big{font-size:340px;line-height:.95;font-weight:800}
.hero .unit{font-size:104px;font-weight:700;font-family:'Inter Display';letter-spacing:-.02em}
.kpi{padding:26px 44px 32px;min-width:400px}
.kpi small{display:block;font-size:38px;color:var(--dim)}
.kpi b{display:block;font-size:84px;margin-top:2px;line-height:1.1}
.kpi .tr{margin-top:14px}

/* ---------- Monatsgrafik je Jahr ---------- */
.chart{flex:1;padding:96px 50px 118px;display:flex}
.plot{position:relative;flex:1;display:flex;align-items:flex-end;gap:26px;border-bottom:2px solid rgba(255,255,255,.3)}
.col{position:relative;flex:1;height:100%;display:flex;align-items:flex-end}
.col i{display:block;width:100%;min-height:3px;border-radius:14px 14px 4px 4px;background:linear-gradient(180deg,#a8d0ff 0%,#4f9dff 30%,rgba(47,110,232,.55) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 1px 0 0 rgba(255,255,255,.18),0 0 26px rgba(79,157,255,.4)}
.col.pk i{background:linear-gradient(180deg,#fff0c4 0%,#ffc74a 28%,rgba(245,165,42,.6) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 0 44px rgba(255,199,74,.65)}
.col.run i{background:repeating-linear-gradient(135deg,rgba(143,196,255,.75) 0 12px,rgba(79,157,255,.3) 12px 24px);box-shadow:inset 0 0 0 2px #a8d0ff}
.col b{position:absolute;left:50%;translate:-50% 0;font-size:42px;white-space:nowrap;color:#fff;letter-spacing:-.02em}
.col.pk b{color:var(--yel)}
.col span{position:absolute;top:calc(100% + 16px);left:50%;translate:-50% 0;font-size:38px;font-weight:600;color:#e6eeff}
.col em{position:absolute;top:calc(100% + 66px);left:50%;translate:-50% 0;font-size:26px;font-style:normal;white-space:nowrap;color:var(--yel);font-weight:600}

/* ---------- Fraktionen ---------- */
.s-frak .body{gap:50px;align-items:center}
.donut{width:610px;height:610px;flex:none;border-radius:50%;display:grid;place-items:center}
.donut svg{position:absolute;inset:40px;width:calc(100% - 80px);height:calc(100% - 80px);rotate:-90deg;overflow:visible}
.donut circle{fill:none;stroke-width:20;stroke-linecap:butt}
.donut .mid{text-align:center}
.donut .mid b{display:block;font-size:112px;line-height:1}
.donut .mid small{font-size:32px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.list{flex:1;display:flex;flex-direction:column;gap:16px}
.li{display:flex;align-items:center;padding:0 34px;height:98px;border-radius:26px;font-size:40px}
.li .dot{width:22px;height:22px;border-radius:50%;margin-right:26px;box-shadow:0 0 18px currentColor;background:currentColor;flex:none}
.li .nm{flex:1;color:#f1f5ff;white-space:nowrap}
.li b{width:230px;text-align:right;font-size:52px;color:#fff}
.li .pc{width:150px;text-align:right;color:var(--dim);font-size:42px}

/* ---------- Entsorger ---------- */
.s-ents .body{display:grid;grid-template-columns:500px 1fr;gap:26px}
.heroc{padding:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring{position:relative;width:310px;height:310px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;rotate:-90deg;overflow:visible}
.ring circle{fill:none;stroke-width:14;stroke-linecap:round}
.ring b{font-size:72px}
.heroc h3{font-size:60px;font-weight:700;margin-top:18px;font-family:'Inter Display'}
.heroc p{font-size:88px;line-height:1.1}
.g3{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:26px}
.et{padding:28px 32px;display:flex;flex-direction:column;justify-content:space-between;border-radius:30px}
.et .top{font-size:40px;font-weight:600;color:#f1f5ff}
.et .top span{display:block;font-size:32px;white-space:nowrap;font-weight:400;color:var(--yel);margin-top:2px;min-height:34px}
.et b{font-size:88px;line-height:1.05}

/* ---------- Metalle ---------- */
.s-met .body{gap:28px}
.metl{width:600px;flex:none;display:flex;flex-direction:column;gap:24px}
.metl .gl{padding:26px 36px;display:flex;flex-direction:column;justify-content:center}
.metl small{font-size:36px;color:var(--dim)}
.metl .fe{flex:1.5}
.metl .fe b{font-size:150px;line-height:1.05}
.metl .sc{flex:1}
.metl .sc b{font-size:84px;line-height:1.1}
.metl .sc em{font-style:normal;font-size:40px;color:#e6eeff}
.metr{flex:1;padding:30px 44px 26px;display:flex;flex-direction:column}
.metr .cap{display:flex;justify-content:space-between;align-items:baseline;font-size:34px;color:var(--blue2);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.metr .cap b{font-size:60px;letter-spacing:-.02em;text-transform:none}
.metr .rows{flex:1;display:flex;flex-direction:column;justify-content:space-around;margin-top:8px}
.mr{display:flex;align-items:center;font-size:40px}
.mr .nm{width:400px;color:#f1f5ff;white-space:nowrap}
.mr .bar{flex:1;height:34px}
.mr .bar i{display:block;height:100%;min-width:10px;border-radius:17px;background:linear-gradient(90deg,rgba(47,110,232,.5),#4f9dff 70%,#a8d0ff);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 26px rgba(79,157,255,.45)}
.mr:first-child .bar i{background:linear-gradient(90deg,rgba(245,165,42,.5),#ffc74a 70%,#fff0c4);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 26px rgba(255,199,74,.45)}
.mr b{width:250px;text-align:right;font-size:52px}
.metx{display:flex;gap:24px;margin-top:12px}
.metx div{flex:1;border-radius:22px;padding:14px 26px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);font-size:30px;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
.metx b{font-size:42px;color:#fff;white-space:nowrap}

/* ---------- Container ---------- */
.s-cont .body{flex-direction:column;gap:24px}
.c74{display:flex;align-items:center;gap:60px;flex:1}
.c74 .n{font-size:330px;line-height:.9;font-weight:800}
.c74 h3{font-family:'Inter Display';font-size:80px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.c74 .l{flex:none}
.c74 .r{flex:1}
.c74 .cap{font-size:40px;color:var(--dim);margin:10px 0 16px;letter-spacing:.1em;text-transform:uppercase}
.c74 .cap b{color:#fff;font-size:48px}
.c74 .row .gl{flex:1;padding:18px 30px;border-radius:28px;display:flex;align-items:baseline;gap:18px}
.c74 .row b{font-size:100px;line-height:1}
.c74 .row .gl>span{font-size:38px;color:var(--dim)}
.split{padding:24px 40px 26px}
.split .cap{font-size:32px;color:var(--blue2);font-weight:600}
.stripe{display:flex;gap:8px;height:88px;margin:12px 0 16px}
.stripe div{overflow:hidden;border-radius:20px;display:flex}
.stripe i{display:flex;align-items:center;flex:none;width:100%;border-radius:20px;font-style:normal;font-size:52px;font-weight:800;padding-left:28px;color:#071022;font-family:'Inter Display';box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.lg{display:flex;justify-content:space-between;font-size:40px}
.lg span{display:flex;align-items:center;gap:16px}
.lg span::before{content:'';width:24px;height:24px;border-radius:7px;background:currentColor;box-shadow:0 0 12px currentColor}
.lg em{font-style:normal;color:#f1f5ff}

/* ---------- Getankt gesamt ---------- */
.fu{padding:22px 40px 26px;min-width:330px}
.fu small{display:block;font-size:38px;color:var(--dim)}
.fu b{display:block;font-size:76px;line-height:1.1}

/* ---------- Tankkarten ---------- */
.s-kart .body{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:24px}
.tk{padding:26px 30px;display:flex;flex-direction:column;justify-content:space-between;border-radius:32px}
.tk .top{display:flex;justify-content:space-between;align-items:flex-start;font-size:36px;font-weight:600;color:#f1f5ff;line-height:1.2}
.tk .top span{color:var(--dim);flex:none;margin-left:10px;font-size:40px;font-weight:400}
.tk b{font-size:112px;line-height:1}
.tk b small{font-size:52px;font-weight:600;color:var(--dim);margin-left:8px;letter-spacing:0;-webkit-text-fill-color:initial}

/* ---------- Tankstellen ---------- */
.s-tst .body{gap:28px}
.tubes{flex:1.75;display:flex;justify-content:space-around;align-items:stretch;padding:28px 20px 26px}
.tb{display:flex;flex-direction:column;align-items:center;width:310px}
.tb b{font-size:72px;white-space:nowrap;line-height:1}
.tb .pc{font-size:40px;color:var(--dim);margin:2px 0 12px}
.tb .glass{flex:1;width:150px;border-radius:75px;position:relative;overflow:hidden;background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,.03) 40%,rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 0 30px rgba(0,0,10,.5)}
.tb .glass i{position:absolute;left:0;right:0;bottom:0;border-radius:0 0 75px 75px;background:linear-gradient(180deg,#a8d0ff,#4f9dff 18%,#2456c8);box-shadow:0 0 40px rgba(79,157,255,.7)}
.tb .glass i::before{content:'';position:absolute;left:0;right:0;top:0;height:10px;background:rgba(255,255,255,.75);border-radius:50%;translate:0 -4px;filter:blur(2px)}
.tb .glass::after{content:'';position:absolute;left:16px;top:26px;bottom:26px;width:14px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.05))}
.tb.y .glass i{background:linear-gradient(180deg,#fff0c4,#ffc74a 18%,#e08a14);box-shadow:0 0 40px rgba(255,199,74,.7)}
.tb .nm{font-size:34px;font-weight:600;margin-top:12px;text-align:center;color:#f1f5ff;line-height:1.15;min-height:80px}
.chips{flex:1;display:flex;flex-direction:column;gap:24px}
.chp{flex:1;padding:0 36px;border-radius:32px;display:flex;align-items:center;justify-content:space-between}
.chp .nm{font-size:38px;font-weight:600;color:#f1f5ff}
.chp .nm span{display:block;font-size:40px;font-weight:400;color:var(--dim)}
.chp b{font-size:84px;white-space:nowrap;line-height:1}
.chp b small{font-size:46px;font-weight:600;color:var(--dim);margin-left:8px;-webkit-text-fill-color:initial}

/* ---------- Fuhrpark ---------- */
.s-fuhr .body{flex-direction:column;gap:22px}
.fgrid{flex:1;display:grid;grid-template-columns:repeat(var(--c),1fr);gap:22px}
.fz{border-radius:30px;padding:20px 26px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.fz .top{display:flex;align-items:center;justify-content:space-between}
.fz .dt{font-size:46px;font-weight:700;font-family:'Inter Display'}
.plate{display:inline-flex;align-items:stretch;border-radius:11px;background:linear-gradient(180deg,#fff,#dfe5f2);color:#0a0f1c;font-weight:800;font-size:40px;letter-spacing:.01em;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.5),inset 0 0 0 3px #0a0f1c;font-family:'Inter Display'}
.plate::before{content:'D';width:28px;background:#1d4fd0;color:#fff;font-size:15px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px}
.plate span{padding:7px 16px 7px 12px;white-space:nowrap}
.fz .vh{font-size:40px;color:#f1f5ff;white-space:nowrap}
.fz .neu{display:inline-block;margin-left:16px;padding:2px 16px;border-radius:30px;background:var(--yel);color:#1a1204;font-size:28px;font-weight:800;vertical-align:middle}
.fn{font-size:42px;color:#f1f5ff;text-align:center;font-weight:600}

/* ---------- Finale ---------- */
.s-fin{align-items:center;text-align:center;padding-top:50px;padding-bottom:50px;justify-content:center}
.s-fin .eb{font-size:36px;letter-spacing:.4em}
.s-fin .eb::before{display:none}
.s-fin .row{margin:26px 0 36px;gap:34px}
.fin{padding:26px 60px 34px;min-width:680px}
.fin small{font-size:32px;color:var(--dim);letter-spacing:.2em;text-transform:uppercase}
.fin b{display:block;font-size:160px;line-height:1.05}
.fin>span{font-size:60px;font-weight:700;font-family:'Inter Display'}
.s-fin h1{font-family:'Inter Display';font-size:150px;font-weight:800;letter-spacing:-.04em;line-height:1}

<body>
<div id="stage">
  <div class="orb" id="o1"></div><div class="orb" id="o2"></div><div class="orb" id="o3"></div>
  <div class="orb" id="ring1"></div><div class="orb" id="ring2"></div>
  <div class="orb" id="o4"></div><div class="orb" id="o5"></div><div class="orb" id="o6"></div>
  <div id="vig"></div>
  <div id="scenes"></div>
  <div id="foot"><span id="ft"></span><img src="logo.png" alt=""></div>
  <div id="prog"></div>
  <div id="fade"></div>
</div>
<script src="data.js"></script>
<script>
const Q=new URLSearchParams(location.search);
const PORT=Q.get('fmt')==='port';
if(PORT)document.body.classList.add('port');
const W=PORT?1080:1920,H=PORT?1920:1080;
const BAR=2.4; // ein Takt der Musik; die Szenenlängen stehen genauso in music.py
const de=(v,d=0)=>v.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const cnt=(to,dec,at,dur=2.2)=>`<span class="cnt" data-to="${to}" data-dec="${dec}" data-at="${at}" data-dur="${dur}">${de(to,dec)}</span>`;
const hd=(eb,h,rt='')=>`<div class="hd"><header><div class="eb a" style="--d:.15">${eb}</div><h2 class="a" style="--d:.3">${h}</h2></header>${rt}</div>`;
const PAL=['#4f9dff','#ffc74a','#8fc4ff','#2f6ee8','#ffe29a','#c9d6f2','#7786a8'];

/* Monatsgrafik eines Jahres: höchstens 12 Balken, Wert über jedem Balken, laufender Monat markiert */
function yearChart(j,key,dec){
  const v=j[key],max=Math.max(...v,1e-9);
  return `<div class="plot">${v.map((x,i)=>{const h=x/max*100,pk=x===max,run=i===j.laufend,d=(.8+i*.12).toFixed(2);
    return `<div class="col${pk?' pk':''}${run?' run':''}"><i class="gh" style="height:${h}%;--d:${d}"></i><b class="num pop" style="bottom:calc(${h}% + 10px);--d:${(1.5+i*.12).toFixed(2)}">${de(x,dec)}</b><span>${j.mon[i]}</span>${run?'<em>läuft noch</em>':''}</div>`}).join('')}</div>`;
}
function donut(){
  let off=0,s='';
  D.frak.forEach((f,i)=>{const l=f.t/D.total*1000;s+=`<circle class="seg" cx="50%" cy="50%" r="47%" pathLength="1000" stroke="${PAL[i%7]}" style="--d:${(.7+i*.22).toFixed(2)};stroke-dasharray:${Math.max(l-5,2).toFixed(1)} 1000;stroke-dashoffset:${(-off).toFixed(1)};filter:drop-shadow(0 0 10px ${PAL[i%7]})"/>`;off+=l});
  return `<svg><circle cx="50%" cy="50%" r="47%" stroke="rgba(255,255,255,.07)"/>${s}</svg>`;
}

/* ---------- Szenen: [Klasse, Länge in Takten, HTML] ---------- */
const SC=[];
SC.push(['s-title',4,`<img class="logo a z" style="--d:.5" src="logo.png">
<div class="eb a" style="--d:1.3">Statistik</div>
<h1><span class="a" style="--d:1.7">Das</span> <span class="a" style="--d:1.85">haben</span> <span class="a" style="--d:2">wir</span><br><span class="a yt" style="--d:2.5">geschafft.</span></h1>
<div class="gl t a pill" style="--d:3.3;--k:2">Unsere Zahlen von <b>${D.von}</b> bis <b>${D.bis}</b></div>`]);

const jmax=Math.max(...D.jahre.map(j=>j.t));
SC.push(['s-hero',5,hd(`Entsorgt seit ${D.von}`,'Das haben wir gemeinsam bewegt')+`<div class="body">
<div class="hero a z" style="--d:.7"><span class="num big wt">${cnt(D.total,1,.8,3.2)}</span><span class="unit bt">Tonnen</span></div>
<div class="row" style="margin-top:36px">
${D.jahre.map((j,i)=>{const last=i===D.jahre.length-1;return `<div class="gl${last?' y':''} t a kpi" style="--d:${2.6+i*.3};--k:${last?-1.6:1.6};--x:${.06*(i+1)}"><small>${j.l}</small><b class="num ${last?'yt':'wt'}">${cnt(j.t,1,2.8+i*.3,2)} t</b><div class="tr"><i class="gw" style="--d:${3+i*.3};width:${j.t/jmax*100}%"></i></div></div>`}).join('')}
${D.ohne_datum?`<div class="gl t a kpi" style="--d:${2.6+D.jahre.length*.3};--k:1;--x:.2"><small>Zuschlag für fehlende Belege</small><b class="num wt">${cnt(D.ohne_datum,1,3.5,1.6)} t</b></div>`:''}
</div></div>`]);

D.jd.forEach(j=>SC.push(['s-year',4,hd(`Gewogene Tonnen pro Monat`,`Monat für Monat ${j.jahr}`,`<div class="rt a" style="--d:.6"><small>${j.jahr} gewogen</small><b class="num yt">${cnt(j.t_sum,1,.8,2.4)} t</b></div>`)+
  `<div class="body"><div class="gl t a chart" style="--d:.5;--k:.7">${yearChart(j,'t',1)}</div></div>`]));

SC.push(['s-frak',5,hd('Was wir entsorgen','Die größten Fraktionen')+`<div class="body">
<div class="gl t a donut" style="--d:.5;--k:1.5">${donut()}<div class="mid"><b class="num wt">${cnt(D.total,1,.8,2.6)} t</b><small>gesamt</small></div></div>
<div class="list">${D.frak.map((f,i)=>`<div class="gl a l li" style="--d:${(.9+i*.2).toFixed(2)};--x:${(i*.03).toFixed(2)};color:${PAL[i%7]}"><span class="dot"></span><span class="nm">${f.n}</span><b class="num">${cnt(f.t,1,1+i*.2,1.6)} t</b><span class="pc">${f.p} %</span></div>`).join('')}</div></div>`]);

const E0=D.ents[0];
SC.push(['s-ents',5,hd('Wo wir entsorgen','Unsere Entsorger')+`<div class="body">
<div class="gl y t a heroc" style="--d:.5;--k:1.4"><div class="ring"><svg><circle cx="50%" cy="50%" r="46%" stroke="rgba(255,255,255,.08)"/><circle class="seg" cx="50%" cy="50%" r="46%" pathLength="1000" stroke="#ffc74a" style="--d:1;stroke-dasharray:${(E0.t/D.total*1000).toFixed(0)} 1000;filter:drop-shadow(0 0 12px #ffc74a)"/></svg><b class="num yt">Nr. 1</b></div><div><h3>${E0.n}</h3><p class="num wt">${cnt(E0.t,1,.9,2.4)} t</p></div></div>
<div class="g3">${D.ents.slice(1).map((e,i)=>`<div class="gl a et" style="--d:${(1+i*.22).toFixed(2)};--x:${(i*.04).toFixed(2)}"><div class="top">${e.n}<span>${e.sub}</span></div><b class="num wt">${cnt(e.t,1,1.1+i*.22,1.8)} t</b><div class="tr"><i class="gw" style="--d:${(1.4+i*.22).toFixed(2)};width:${e.t/E0.t*100}%"></i></div></div>`).join('')}</div></div>`]);

const M=D.metalle,SS=D.schiessler,mk=M.rows[0].kg;
SC.push(['s-met',6,hd('Metall und Schrott im Detail','Jedes Kilo zählt')+`<div class="body">
<div class="metl">
<div class="gl y t a fe" style="--d:.5;--k:1.3"><small>Eisen- und Stahlschrott</small><b class="num yt">${cnt(M.eisen_t,1,.7,2.8)} t</b></div>
<div class="gl a sc" style="--d:1.1;--x:.05"><small>Bei Schießler insgesamt</small><b class="num wt">${cnt(SS.t,1,1.3,2.2)} t</b><em>${de(SS.wiegescheine)} Wiegescheine</em></div>
</div>
<div class="gl t a metr" style="--d:1.6;--k:.8;--x:.1"><div class="cap">Buntmetalle<b class="num wt">${cnt(M.bunt_kg,0,1.9,2.4)} kg</b></div>
<div class="rows">${M.rows.map((r,i)=>`<div class="mr"><span class="nm fi" style="--d:${(2.3+i*.22).toFixed(2)}">${r.n}</span><span class="bar"><i class="gw" style="--d:${(2.4+i*.22).toFixed(2)};width:${r.kg/mk*100}%"></i></span><b class="num fi" style="--d:${(2.6+i*.22).toFixed(2)}">${cnt(r.kg,0,2.4+i*.22,1.6)} kg</b></div>`).join('')}</div>
<div class="metx fi" style="--d:4.6"><div>Altreifen<b class="num">${de(SS.reifen,1)} t${SS.reifen_stk?` + ${SS.reifen_stk} Stück`:''}</b></div><div>Elektrogeräte<b class="num">${de(SS.elektro,1)} t</b></div></div>
</div></div>`]);

const C=D.container,TR=D.trenn;
SC.push(['s-cont',5,hd('Container und Trennquote','Organisiert und getrennt')+`<div class="body">
<div class="c74"><div class="l a z" style="--d:.6"><span class="num n yt">${cnt(C.gefuellt,0,.7,2.6)}</span></div>
<div class="r"><h3 class="a" style="--d:1.2">Container gefüllt</h3><div class="cap a" style="--d:1.9"><b>${cnt(C.einsaetze,0,2,1.8)}</b> Einsätze</div>
<div class="row"><div class="gl a" style="--d:2.2"><b class="num wt">${cnt(C.gestellt,0,2.3,1.6)}</b><span>gestellt</span></div><div class="gl a" style="--d:2.45;--x:.05"><b class="num wt">${cnt(C.getauscht,0,2.55,1.6)}</b><span>getauscht</span></div><div class="gl a" style="--d:2.7;--x:.1"><b class="num wt">${cnt(C.abgeholt,0,2.8,1.6)}</b><span>abgeholt</span></div></div></div></div>
<div class="gl t a split" style="--d:3.8;--k:.8;--x:.15"><div class="cap">So liefern wir an (gewogene Tonnen)</div>
<div class="stripe"><div style="flex:${TR.sortenrein}"><i class="gw" style="--d:4.4;background:linear-gradient(90deg,#4f9dff,#a8d0ff)">${TR.p_sortenrein} %</i></div><div style="flex:${TR.gemischt}"><i class="gw" style="--d:4.9;background:linear-gradient(90deg,#aab8d6,#dbe4f6)">${TR.p_gemischt} %</i></div><div style="flex:${TR.gefaehrlich}"><i class="gw" style="--d:5.4;background:linear-gradient(90deg,#ff8a4a,#ffb27a);padding:0"></i></div></div>
<div class="lg"><span class="fi" style="--d:4.6;color:#4f9dff"><em>sortenrein: ${de(TR.sortenrein,1)} t</em></span><span class="fi" style="--d:5.1;color:#c3cfe8"><em>gemischt: ${de(TR.gemischt,1)} t</em></span><span class="fi" style="--d:5.6;color:#ff9a5c"><em>gefährlich: ${de(TR.gefaehrlich,1)} t (${TR.p_gefaehrlich} %)</em></span></div></div></div>`]);

SC.push(['s-hero',4,hd(`Getankt seit ${D.von}`,'Immer in Bewegung')+`<div class="body">
<div class="hero a z" style="--d:.6"><span class="num big yt">${cnt(D.liter,0,.7,2.8)}</span><span class="unit yt">Liter</span></div>
<div class="row" style="margin-top:36px">
<div class="gl t a fu" style="--d:2.2;--k:1.4"><small>Diesel</small><b class="num wt">${cnt(D.diesel,0,2.3,1.8)} l</b></div>
<div class="gl t a fu" style="--d:2.45;--k:1;--x:.05"><small>Benzin</small><b class="num wt">${cnt(D.benzin,0,2.55,1.8)} l</b></div>
<div class="gl t a fu" style="--d:2.7;--k:-1.4;--x:.1"><small>AdBlue</small><b class="num wt">${cnt(D.adblue,0,2.8,1.8)} l</b></div>
</div></div>`]);

D.jd.forEach(j=>SC.push(['s-year',4,hd(`Liter pro Monat`,`Getankt ${j.jahr}`,`<div class="rt a" style="--d:.6"><small>${j.jahr} getankt</small><b class="num yt">${cnt(j.l_sum,0,.8,2.4)} l</b></div>`)+
  `<div class="body"><div class="gl t a chart" style="--d:.5;--k:.7">${yearChart(j,'l',0)}</div></div>`]));

SC.push(['s-kart',5,hd('Wer tankt wie viel','Liter je Tankkarte')+`<div class="body">${D.karten.map((k,i)=>`<div class="gl${i===0?' y':''} a tk" style="--d:${(.6+i*.2).toFixed(2)};--x:${(i*.03).toFixed(2)}"><div class="top">${k.n}<span>${k.p} %</span></div><b class="num ${i===0?'yt':'wt'}">${cnt(k.l,0,.7+i*.2,1.8)}<small>l</small></b><div class="tr"><i class="gw" style="--d:${(1+i*.2).toFixed(2)};width:${k.l/D.karten[0].l*100}%"></i></div></div>`).join('')}</div>`]);

SC.push(['s-tst',5,hd('Wo wir tanken','Unsere Tankstellen')+`<div class="body">
<div class="gl t a tubes" style="--d:.5;--k:1.1">${D.tankstellen.slice(0,3).map((s,i)=>`<div class="tb${i===1?' y':''}"><b class="num ${i===1?'yt':'wt'}">${cnt(s.l,0,.9+i*.3,2.4)} l</b><span class="pc">${s.p} %</span><div class="glass"><i class="gh" style="--d:${(.9+i*.3).toFixed(2)};height:${s.l/D.tankstellen[0].l*94}%;animation-duration:2.4s"></i></div><span class="nm">${s.n}</span></div>`).join('')}</div>
<div class="chips">${D.tankstellen.slice(3).map((s,i)=>`<div class="gl a chp" style="--d:${(2.4+i*.25).toFixed(2)};--x:${(i*.04).toFixed(2)}"><div class="nm">${s.n}<span>${s.p} %</span></div><b class="num wt">${cnt(s.l,0,2.5+i*.25,1.6)}<small>l</small></b></div>`).join('')}</div></div>`]);

const FZ=D.fuhrpark,fs=Math.min(.55,4.6/FZ.length);
SC.push(['s-fuhr',6,hd('Wann kam was dazu?','Unser Fuhrpark ist gewachsen')+`<div class="body">
<div class="fgrid" style="--c:${FZ.length<=9?3:4}">${FZ.map((f,i)=>`<div class="gl${f.neu?' y':''} a fz" style="--d:${(.7+i*fs).toFixed(2)};--x:${(i*.03).toFixed(2)}"><div class="top"><span class="dt yt">${f.seit}</span><span class="plate"><span>${f.kz}</span></span></div><div class="vh">${f.name}${f.neu?'<span class="neu">NEU</span>':''}</div></div>`).join('')}</div>
<div class="fn a" style="--d:6.4">Von einem Fahrzeug auf ${FZ.length} in ${Math.max(1,(+D.bis.slice(-4))-(+FZ[0].seit.slice(-4)))} Jahren</div></div>`]);

SC.push(['s-fin',6,`<div class="eb a" style="--d:.4">Das haben wir geschafft</div>
<div class="row"><div class="gl t a fin" style="--d:.9;--k:1.5"><small>Entsorgt</small><b class="num wt">${cnt(D.total,1,1.1,3)}</b><span class="bt">Tonnen.</span></div>
<div class="gl y t a fin" style="--d:1.4;--k:-1.5"><small>Getankt</small><b class="num yt">${cnt(D.liter,0,1.6,3)}</b><span class="yt">Liter.</span></div></div>
<h1 class="a z" style="--d:4.6">Danke ans <span class="yt">Team.</span></h1>
<p class="a" style="--d:6.2">${de(D.belegt,1)} Tonnen sind gewogen und belegt, ${de(D.geschaetzt,1)} Tonnen sind geschätzt.<br>Einige Belege fehlen noch. Stand ${D.stand}.</p>
<img class="logo a" style="--d:7" src="logo.png">`]);

const LEN=SC.map(s=>s[1]),ST=[];let acc=0;for(const l of LEN){ST.push(acc*BAR);acc+=l}
const TOTAL=acc*BAR;
const root=document.getElementById('scenes');
const scenes=SC.map(([cls,len,html],i)=>{const s=document.createElement('section');s.className='scene '+cls;s.dataset.i=i;
  s.style.setProperty('--s',ST[i]);s.style.setProperty('--e',i===SC.length-1?9999:ST[i]+len*BAR);s.innerHTML=html;root.appendChild(s);return s});
const counters=[...document.querySelectorAll('.cnt')].map(el=>({el,to:+el.dataset.to,dec:+el.dataset.dec,at:+el.dataset.at,dur:+el.dataset.dur,s:ST[+el.closest('.scene').dataset.i],last:''}));
const $=id=>document.getElementById(id);
$('ft').textContent=`Platzwerk Allgäu · Statistik · Stand ${D.stand}`;
const stage=$('stage'),orbs=['o1','o2','o3','o4','o5','o6','ring1','ring2'].map($);
const sin=Math.sin,cos=Math.cos,clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const eo=x=>1-Math.pow(1-x,4);
const LAST=SC.length-1;

function seek(T){
  T=clamp(T,0,TOTAL);
  scenes.forEach((s,i)=>s.classList.toggle('on',T>=ST[i]-.02&&T<ST[i]+LEN[i]*BAR+.02));
  for(const c of counters){const p=clamp((T-c.s-c.at)/c.dur,0,1),v=de(c.to*eo(p),c.dec);if(v!==c.last){c.el.textContent=v;c.last=v}}
  // Kamera: sanftes Kippen und Schweben
  stage.style.setProperty('--rx',(sin(T*.31)*1.8).toFixed(3)+'deg');
  stage.style.setProperty('--ry',(sin(T*.23+1.1)*3).toFixed(3)+'deg');
  stage.style.setProperty('--fy',(sin(T*.52)*7).toFixed(2)+'px');
  stage.style.setProperty('--shx',(50+sin(T*.23+1.1)*45).toFixed(1)+'%');
  // Lichter im Hintergrund
  const P=[[.78+.10*sin(T*.07),.12+.12*cos(T*.09)],[.12+.12*cos(T*.06+2),.9+.1*sin(T*.08)],[.30+.18*sin(T*.05+4),.2+.14*cos(T*.07+1)],
    [.74+.14*sin(T*.11+1),.56+.2*cos(T*.13)],[.22+.14*cos(T*.12+3),.42+.22*sin(T*.1+2)],[.5+.3*sin(T*.09+5),.82+.1*cos(T*.14)],
    [.68+.1*cos(T*.08),.44+.14*sin(T*.06+2)],[.2+.1*sin(T*.1),.7+.12*cos(T*.09+4)]];
  orbs.forEach((o,i)=>{const w=o.offsetWidth;o.style.transform=`translate(${(P[i][0]*W-w/2).toFixed(1)}px,${(P[i][1]*H-w/2).toFixed(1)}px)`});
  $('prog').style.width=(T/TOTAL*100).toFixed(3)+'%';
  $('foot').style.opacity=clamp((T-ST[1]-.4)/1.2,0,1)*clamp((ST[LAST]-.2-T)/.6,0,1);
  $('fade').style.opacity=Math.max(clamp(1-T/1.1,0,1),clamp((T-(TOTAL-2.4))/2.2,0,1));
  for(const a of document.getAnimations())a.currentTime=T*1000;
}
window.seek=seek;window.TOTAL=TOTAL;window.LEN=LEN;window.ST=ST;
document.fonts.ready.then(()=>{seek(+Q.get('t')||0);window.READY=true;
  if(!Q.has('render')&&!Q.has('t')){ // Vorschau im Browser
    const fit=()=>{const k=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`scale(${k})`};fit();addEventListener('resize',fit);
    const t0=performance.now();(function loop(){seek(((performance.now()-t0)/1000)%TOTAL);requestAnimationFrame(loop)})();
  }});
</script>
</body>
</html>
